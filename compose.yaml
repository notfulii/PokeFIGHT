services:
  pokefight:
    build: .
    image: pokefight
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
    volumes:
      - pokefight-data:/app/assets/data
      - pokefight-sprites:/app/assets/sprites
      - pokefight-sounds:/app/assets/sounds

volumes:
  pokefight-data:
  pokefight-sprites:
  pokefight-sounds:
